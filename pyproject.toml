[project]
name = "master-thesis"
version = "0.1.0"
description = "AMBER root-cause analysis research experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow==25.0.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "seaborn>=0.13",
]

[dependency-groups]
dev = [
    # Baseline unit tests import networkx during test collection. Keep this
    # lightweight requirement available for `uv run pytest`; PyTorch and
    # causal-learn remain opt-in below.
    "networkx>=3.2,<4",
    "pytest>=8.0",
]
baseline = [
    "causal-learn>=0.1.4.3,<0.2",
    "networkx>=3.2,<4",
    "torch>=2.2,<3",
]
