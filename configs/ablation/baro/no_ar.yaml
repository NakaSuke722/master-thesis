# BARO pilot reproduction config.
experiment:
  category: "ablation"
  name: "no_ar"

model:
  target: "amber"
  preprocess_strategy: "default"

  params:
    residualization: "raw"
    scoring: "bayes_factor"

    ar_order: 3
    ridge: 1.0e-3
    min_scale: 1.0e-6
    relative_scale_floor: 1.0e-3
    winsor_quantile: null

    prior:
      m: 0.0
      kappa: 1.0e-3
      alpha: 2.0
      beta: 1.0

paths:
  raw_data_dir: "data/raw/baro"
  processed_data_dir: "data/processed/baro"
  results_root: "results"

evaluation:
  k_values: [1, 3, 5]
  granularity: "metric"

  service_aggregation:
    method: "mean_top3"

  metric_aggregation:
    method: "max"

  fine_grained_fault_to_metric:
    cpu: ["cpu"]
    mem: ["mem"]
    delay: ["latency"]
    loss: ["error"]

datasets:
  - online_boutique
  - sock_shop
  - train_ticket
