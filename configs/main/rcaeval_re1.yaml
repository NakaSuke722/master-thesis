benchmark:
  name: "rcaeval_re1"

experiment:
  category: "main"
  name: "amber"

data:
  # null = 利用可能な全normal/abnormal区間を使用する。
  # window sensitivityは後で別実験として行う。
  normal_window_points: null
  abnormal_window_points: null

model:
  target: "amber"
  preprocess_strategy: "default"

  params:
    residualization: "ar"
    scoring: "bayes_factor"

    ar_order: 3
    ridge: 1.0e-3

    min_scale: 1.0e-6
    relative_scale_floor: 1.0e-3

    winsor_quantile: null

    prior:
      m: 0.0
      kappa: 1.0e-3
      alpha: 2.0
      beta: 1.0

paths:
  raw_data_dir: "data/raw/rcaeval_re1"
  processed_data_dir: "data/processed"
  results_root: "results"

evaluation:
  k_values: [1, 3, 5]

  # RCAEval RE1では正式評価はservice-level。
  granularity: "service"

  service_aggregation:
    method: "mean_top3"

  metric_aggregation:
    method: "max"

datasets:
  - re1_ob
  - re1_ss
  - re1_tt