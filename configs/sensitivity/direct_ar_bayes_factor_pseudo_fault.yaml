analysis:
  name: "direct_ar_bayes_factor_pseudo_fault"
  processed_root: "data/processed/rcaeval_zenodo_v2"
  output_root: "results/analysis/ar_bayes_factor_pseudo_fault"

  # normal windowの先頭側をfit、残りをpseudo-abnormalとする。
  fit_fractions: [0.4, 0.5, 0.6]
  ar_order: 3
  service_aggregation: "mean_top3"
  strong_evidence_log_bf: 2.302585092994046  # log(10)

  # すべてinnovation varianceのprior meanが1になるようbeta/(alpha-1)を固定。
  prior_profiles:
    weak:
      intercept_mean: 0.0
      lag_mean: 0.0
      intercept_precision: 0.001
      lag_precision: 0.1
      alpha: 1.5
      beta: 0.5
    reference:
      intercept_mean: 0.0
      lag_mean: 0.0
      intercept_precision: 0.01
      lag_precision: 1.0
      alpha: 2.0
      beta: 1.0
    strong:
      intercept_mean: 0.0
      lag_mean: 0.0
      intercept_precision: 0.1
      lag_precision: 10.0
      alpha: 5.0
      beta: 4.0
