# configs/default_params.yaml
model:
  target: "amber"
  preprocess_strategy: "default"

paths:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  results_dir: "results/main/amber/"

evaluation:
  k_values: [1, 3, 5]

  # service: サービス単位（粗粒度）
  # metric:  サービス＋メトリクス種別単位（細粒度）
  granularity: "metric"

  service_aggregation:
    method: "mean_top3"  # max / mean_top3 / logsumexp

  # latency-50, latency-90 などを latency に統合する際の集約
  metric_aggregation:
    method: "max"  # max / mean / logsumexp

  # 障害ディレクトリ名の末尾から、細粒度の正解メトリクス種別へ対応付ける。
  # loss はデータセットによって error 列がないため、error または latency を正解候補とする。
  fine_grained_fault_to_metric:
    cpu: ["cpu"]
    mem: ["mem"]
    delay: ["latency"]
    loss: ["error"]

datasets:
  - online_boutique
  - sock_shop
  - train_ticket