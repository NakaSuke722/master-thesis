benchmark:
  name: "rcaeval_re1"
experiment:
  category: "baselines"
  name: "run_neural_granger_known_onset"
data:
  source:
    provider: "Zenodo"
    record: "14590730"
    doi: "10.5281/zenodo.14590730"
    version: "v2"
  normal_window_points: 600
  abnormal_window_points: 600
model:
  target: "run"
  preprocess_strategy: "default"
  params:
    protocol: "run_neural_granger_known_onset"
    training_scope: "normal_only"
    seq_len: 32
    hidden_size: 128
    moving_average_kernel: 25
    pretrain_epochs: 1
    epochs: 1
    learning_rate: 0.001
    batch_size: 128
    device: "cpu"
    seed: 42
    source_repository: "https://github.com/zmlin1998/RUN"
    source_commit: "e2c97d7b5796455a1acbd66ab10c5bbb88eaccc8"
    rcaeval_reference_commit: "526cdd5818ea9d8c2a34e869ebd637bc6b4fa4b8"
paths:
  raw_data_dir: "data/raw/rcaeval_zenodo_v2"
  processed_data_dir: "data/processed/rcaeval_zenodo_v2"
  results_root: "results"
evaluation:
  k_values: [1, 3, 5]
  granularity: "service"
  service_aggregation:
    method: "metric_order_deduplication"
  metric_aggregation:
    method: "max"
datasets:
  - re1_ob
  - re1_ss
  - re1_tt
