benchmark:
  name: "rcaeval_re1"
experiment:
  category: "baselines"
  name: "circa_stratified_adaptive_pc_rht"
data:
  source:
    provider: "Zenodo"
    record: "14590730"
    doi: "10.5281/zenodo.14590730"
    version: "v2"
  normal_window_points: 600
  abnormal_window_points: 600
model:
  target: "circa"
  preprocess_strategy: "default"
  params:
    protocol: "rcaeval_stratified_adaptive_pc_graph_circa_rht"
    pc_alpha: 0.05
    stable: true
    lookup_window: 120
    detect_window: 10
    score_time_offset: 300
    # Fisher-Z requires invertible correlation submatrices. Remove only
    # numerical duplicates from PC input; they remain RHT candidates.
    pc_redundancy_threshold: 0.999999999999
    # Full PC is intractable for the 275-metric RE1-SS cases. Use the
    # standard PC-stable skeleton through conditioning order one.
    pc_max_conditioning_set: 1
    # Select without GT/anomaly scores and retain service coverage. Metrics
    # outside the graph are still ranked by CIRCA's parentless RHT path.
    pc_max_metrics: 60
    graph_learning_scope: "normal_and_abnormal"
    source_repository: "https://github.com/NetManAIOps/CIRCA"
    source_commit: "0215e1880096aa02a305c697f1c23cac4600ebd2"
    paper_artifact_commit: "1522ddd7efd16db55e9f351fd70324501ce9134e"
    rcaeval_reference_commit: "526cdd5818ea9d8c2a34e869ebd637bc6b4fa4b8"
paths:
  raw_data_dir: "data/raw/rcaeval_zenodo_v2"
  processed_data_dir: "data/processed/rcaeval_zenodo_v2"
  results_root: "results"
evaluation:
  k_values: [1, 3, 5]
  granularity: "service"
  service_aggregation:
    method: "metric_order_deduplication"
  metric_aggregation:
    method: "max"
datasets:
  - re1_ob
  - re1_ss
  - re1_tt
