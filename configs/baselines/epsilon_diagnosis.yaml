benchmark:
  name: "rcaeval_re1"
experiment:
  category: "baselines"
  name: "epsilon_diagnosis_known_onset"
data:
  source:
    provider: "Zenodo"
    record: "14590730"
    doi: "10.5281/zenodo.14590730"
    version: "v2"
  normal_window_points: 600
  abnormal_window_points: 600
model:
  target: "epsilon_diagnosis"
  preprocess_strategy: "default"
  params:
    protocol: "pyrca_epsilon_diagnosis_known_onset"
    alpha: 0.01
    bootstrap_time: 200
    root_cause_top_k: 5
    seed: 42
    source_repository: "https://github.com/salesforce/PyRCA"
    source_commit: "411310d589fac5cb8e7bdce67d33eadb091a1083"
    rcaeval_reference_commit: "526cdd5818ea9d8c2a34e869ebd637bc6b4fa4b8"
paths:
  raw_data_dir: "data/raw/rcaeval_zenodo_v2"
  processed_data_dir: "data/processed/rcaeval_zenodo_v2"
  results_root: "results"
evaluation:
  k_values: [1, 3, 5]
  granularity: "service"
  service_aggregation:
    method: "metric_order_deduplication"
  metric_aggregation:
    method: "max"
datasets:
  - re1_ob
  - re1_ss
  - re1_tt
