name: CI

on: # 実行タイミング
  pull_request: # PRを作成・更新したとき
  push:
    branches:
      - main # mainへマージ・pushされたとき

permissions: # CIにリポジトリ読み取り権限だけを与える。テストには書き込み権限が不要なため、最小権限。
  contents: read

concurrency: # 同じPRへ連続pushした場合、古いCIをキャンセルして最新だけを実行。
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          python-version: "3.12"
          enable-cache: true # ローカル検証と同じuv 0.12.17、Python 3.12を使用。

      - name: Sync dependencies
        run: uv sync --locked # pyproject.toml と uv.lock が一致しなければエラーにする。CI中に勝手にロックファイルを書き換えない。

      - name: Install zsh
        run: |
            sudo apt-get update
            sudo apt-get install --yes zsh
      - name: Run tests # テスト実行
        run: uv run --frozen pytest -q -rs # --frozen: ロックファイルを更新しない -q: 出力を簡潔にする -rs: skip理由を表示する